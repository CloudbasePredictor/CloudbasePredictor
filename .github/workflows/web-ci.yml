name: Web CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify web distribution
    permissions:
      contents: read
    uses: ./.github/workflows/web-verify.yml
    with:
      snapshot: fixture
      dist-artifact: web-production
      reports-artifact: web-release-gate-reports
