name: Refresh launch-site snapshot

# Starts a deploy once a week so the site picks up the current ParaglidingEarth dataset.
#
# The schedule is kept apart from web-deploy.yml deliberately. GitHub disables a workflow with a
# `schedule` trigger after 60 days without repository activity, and a disabled workflow does not run
# for pushes either. Keeping the cron here means the worst case is a paused weekly refresh in a
# quiet repository, never a push that silently fails to deploy. web-deploy.yml switches this
# workflow back on with the next push to the default branch.

on:
  schedule:
    # Mondays 03:17 UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-snapshot-refresh
  cancel-in-progress: false

jobs:
  start-deploy:
    name: Start a deploy with a fresh dataset
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A run started with the workflow token does not trigger other workflows, except through
      # workflow_dispatch, which is why the deploy is started this way.
      - name: Dispatch the web deploy on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'master' }}
        run: gh workflow run web-deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"

      # The deploy reports its own result. This covers the one thing it cannot: not being started.
      - name: Open or close the alert issue
        if: always()
        uses: ./.github/actions/ci-alert
        with:
          title: Weekly launch-site refresh could not start
          status: ${{ job.status }}
