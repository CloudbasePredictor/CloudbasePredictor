name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BINARYEN_CORES: 1

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-kmp:
    name: Verify Android and web release gates
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run engine tests (JVM and Wasm)
        run: ./gradlew :engine:allTests

      - name: Run shared tests (JVM and browser Wasm)
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: ./gradlew :shared:allTests

      - name: Compile Android instrumentation tests
        run: ./gradlew :app:compileDebugAndroidTestKotlin

      - name: Run static analysis
        run: ./gradlew :app:detekt :engine:detekt :shared:detekt :webApp:detekt

      - name: Run web browser tests
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: ./gradlew :webApp:wasmJsBrowserTest

      - name: Build production web distribution
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Check production bundle budgets
        run: node scripts/web/check-bundle.mjs

      - name: Run browser release gates
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/web/check-browser-release.mjs

      - name: Upload web release-gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-web-gate-reports
          path: webApp/build/reports/release-gates/
          if-no-files-found: ignore

      - name: Upload verified production web distribution
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-web-production
          path: webApp/build/dist/wasmJs/productionExecutable/
          if-no-files-found: error
          retention-days: 1

  verify-webkit-input:
    name: Verify mobile WebKit location input
    needs: verify-kmp
    permissions:
      contents: read
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install release-gate dependencies
        run: npm ci

      - name: Install Playwright WebKit
        run: npx playwright install webkit

      - name: Download verified production web distribution
        uses: actions/download-artifact@v4
        with:
          name: release-web-production
          path: webApp/build/dist/wasmJs/productionExecutable

      - name: Run mobile WebKit input release gate
        run: npm run check:web:webkit-input

      - name: Upload mobile WebKit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-webkit-input-release-gate
          path: webApp/build/reports/release-gates/webkit-input.json
          if-no-files-found: ignore
          retention-days: 14

  build-release:
    name: Build signed release
    needs:
      - verify-kmp
      - verify-webkit-input
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Build signed release AAB
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - name: Clean up keystore
        if: always()
        run: rm -f /tmp/release.keystore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: artifacts/apk

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: artifacts/aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/apk/*.apk
            artifacts/aab/*.aab

  publish-google-play:
    name: Publish to Google Play
    runs-on: ubuntu-latest
    needs: build-release
    if: vars.GOOGLE_PLAY_ENABLED == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: artifacts/aab

      - name: Publish to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cloudbasepredictor
          releaseFiles: artifacts/aab/*.aab
          track: internal
          status: completed
