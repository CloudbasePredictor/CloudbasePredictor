name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Weekly refresh of the ParaglidingEarth launch-site snapshot (Mondays 03:17 UTC).
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Fetches, validates, and tiles the live ParaglidingEarth dataset, then runs every web gate against
  # the resulting distribution. If ParaglidingEarth is unreachable or the snapshot comes back
  # degraded, this fails before anything is published and the previously deployed site stays live.
  # The browser never contacts ParaglidingEarth; only GitHub Actions does.
  verify:
    name: Verify web distribution
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
    uses: ./.github/workflows/web-verify.yml
    with:
      snapshot: live
      min-sites: 8000
      dist-artifact: pages-web-production
      dist-retention-days: 1
      reports-artifact: pages-web-verification-reports

  publish:
    name: Publish GitHub Pages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Publish exactly the bytes every gate ran against. The previous version built the Pages
      # artifact in the same job as the build, before the WebKit gate had even run.
      - name: Download the verified production distribution
        uses: actions/download-artifact@v4
        with:
          name: pages-web-production
          path: dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
