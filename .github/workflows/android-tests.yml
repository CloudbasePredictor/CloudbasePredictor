name: Android Tests

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: android-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run detekt
        run: ./gradlew :app:detekt :engine:detekt :shared:detekt

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            app/build/reports/detekt/
            engine/build/reports/detekt/
            shared/build/reports/detekt/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run engine tests (JVM and Wasm)
        run: ./gradlew :engine:allTests

      - name: Compile androidTest sources
        run: ./gradlew :app:compileDebugAndroidTestKotlin

  # Builds what a tag would publish, on every push and pull request. Until now the minified release
  # variant was built only after a tag was pushed, so an R8 or resource-shrinking break, a missing
  # signing step or a version mismatch was found when the release was already public. Signing uses
  # a key generated for this run, which exercises the same signing and verification steps as
  # release.yml without touching the real key.
  release-rehearsal:
    name: Release Rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Create a throwaway signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/rehearsal.keystore" -storetype PKCS12 \
            -alias rehearsal -keyalg RSA -keysize 2048 -validity 2 \
            -storepass rehearsal-only -dname "CN=Release rehearsal"
          digest="$(keytool -list -v -keystore "$RUNNER_TEMP/rehearsal.keystore" \
            -storepass rehearsal-only -alias rehearsal | sed -n 's/^[[:space:]]*SHA256: //p')"
          test -n "$digest"
          echo "REHEARSAL_CERT_SHA256=$digest" >> "$GITHUB_ENV"

      # Same two invocations as release.yml; the F-Droid build is the first one with one ABI.
      - name: Build minified release APK
        env:
          KEYSTORE_PASSWORD: rehearsal-only
          KEY_ALIAS: rehearsal
          KEY_PASSWORD: rehearsal-only
        run: KEYSTORE_PATH="$RUNNER_TEMP/rehearsal.keystore" ./gradlew :app:assembleRelease -PABI_FILTERS=arm64-v8a

      - name: Build minified release AAB
        env:
          KEYSTORE_PASSWORD: rehearsal-only
          KEY_ALIAS: rehearsal
          KEY_PASSWORD: rehearsal-only
        run: KEYSTORE_PATH="$RUNNER_TEMP/rehearsal.keystore" ./gradlew :app:bundleRelease

      - name: Verify release signatures
        run: >
          bash scripts/release/verify-signature.sh --expected-sha256 "$REHEARSAL_CERT_SHA256"
          app/build/outputs/apk/release/*.apk
          app/build/outputs/bundle/release/*.aab

      - name: Check that the R8 mapping file exists
        run: test -s app/build/outputs/mapping/release/mapping.txt

      - name: Upload R8 reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-rehearsal-reports
          path: |
            app/build/outputs/mapping/release/
            app/build/reports/
          if-no-files-found: ignore

  instrumented-tests:
    name: Instrumented Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: ./gradlew :app:connectedInstrumentationTest
