<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Cloudbase Predictor">
  <title>Cloudbase Predictor</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F4C81"/>
      <stop offset="1" stop-color="#0A2236"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background so the icon is safe as a maskable icon. -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- Thermal updraft rising into the cloud base. -->
  <g fill="none" stroke="#F2B14C" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200 402 q28 -34 56 0 q28 34 56 0"/>
    <path d="M212 452 q22 -26 44 0 q22 26 44 0"/>
  </g>
  <!-- Cloud. -->
  <path fill="#FBFDFF" d="M170 330
    a74 74 0 0 1 6 -147
    a94 94 0 0 1 178 -20
    a70 70 0 0 1 8 167
    z"/>
</svg>
