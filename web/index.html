<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Cloudbase Predictor Web: thermic, wind, cloud and Stuve forecasts for soaring pilots."
    />
    <title>Cloudbase Predictor</title>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="theme-color" content="#fbfdff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a2236" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (() => {
        let mode = "system";
        try {
          const raw = localStorage.getItem("cbp.settings.v1");
          const parsed = raw ? JSON.parse(raw) : null;
          const s = parsed?.settings ?? parsed;
          if (s && (s.themeMode === "light" || s.themeMode === "dark")) mode = s.themeMode;
        } catch {
          /* pre-paint theme is best-effort */
        }
        const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
        const dark = mode === "dark" || (mode === "system" && Boolean(prefersDark));
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
